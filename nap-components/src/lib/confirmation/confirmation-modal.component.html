<div class="modal-header">
    <p class="modal-title">Confirmation</p>
    <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss('Cross click')">
        <span aria-hidden="true" class="text-white">&times;</span>
      </button>
</div>
<div class="modal-body">
    <p>{{ content }}</p>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-primary" (click)="activeModal.close()">OK</button>
    <button type="button" class="btn btn-danger" (click)="activeModal.dismiss('Cancel click')">Cancel</button>
</div>
