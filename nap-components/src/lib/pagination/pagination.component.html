<pagination-template #paginationApi="paginationApi" [id]="config.id" (pageChange)="config.currentPage = $event; raisePageChange()">
    <nav aria-label="Page navigation">
        <span>Page size</span>
        <div class="d-inline-block">
            <select class="form-control" [(ngModel)]="config.itemsPerPage" (ngModelChange)="raisePageChange()">
                <option *ngFor="let item of pageSizes">{{item}}</option>
            </select>
        </div>
        <div class="d-inline-block">
            <ul class="pagination">
                <li class="page-item" [class.disabled]="paginationApi.isFirstPage()">
                    <a (click)="paginationApi.previous()" class="page-link" href="javascript:;" aria-label="Previous">
                        <span aria-hidden="true">&lt;</span>
                        <span class="sr-only">Previous</span>
                    </a>
                </li>
                <li class="page-item" *ngFor="let page of paginationApi.pages" [class.active]="paginationApi.getCurrent() === page.value">
                    <a class="page-link" (click)="paginationApi.setCurrent(page.value)" *ngIf="paginationApi.getCurrent() !== page.value" href="javascript:;">
                        {{ page.label }}
                    </a>
                    <div class="page-link" *ngIf="paginationApi.getCurrent() === page.value">
                        {{ page.label }}
                    </div>
                </li>
                <li class="page-item" [class.disabled]="paginationApi.isLastPage()">
                    <a (click)="paginationApi.next() " class="page-link " href="javascript:;" aria-label="Next ">
                        <span aria-hidden="true ">&gt;</span>
                        <span class="sr-only ">Next</span>
                    </a>
                </li>
            </ul>
        </div>
        <div class="displaying">
            <span>Displaying <b>{{formatNumber(startIndex)}}</b> to <b>{{formatNumber(endIndex)}}</b> of <b>{{formatNumber(config.totalItems)}}</b> item(s)</span>
        </div>
    </nav>
</pagination-template>
