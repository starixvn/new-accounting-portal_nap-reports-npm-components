<div class="container-fluid">
    <div class="nap-header">
        <div class="title">
            nap-components /
            <span class="active">Demo</span>
            <i class="nap-icon" [ngClass]="{'nap-icon-header-expand': isShowSidebar, 'nap-icon-header-collapse': !isShowSidebar}" (click)="isShowSidebar = !isShowSidebar"
                [title]="isShowSidebar ? 'Hide sidebar' : 'Show sidebar'"></i>
        </div>
        <div>GMT-4</div>
    </div>
    <div class="row">
        <ul class="nav flex-column" [hidden]="!isShowSidebar">
            <li class="nav-item" routerLinkActive="active">
                <a class="nav-link" routerLink="form">Form</a>
            </li>
            <li class="nav-item" routerLinkActive="active">
                    <a class="nav-link" routerLink="grid">Grid</a>
                </li>
            <li class="nav-item" routerLinkActive="active">
                <a class="nav-link" routerLink="number-format">Number Format</a>
            </li>
        </ul>
        <div class="col">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
